<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TeleWarden Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: TeleDrive's Soft Swiss shell (sidebar · list · detail on desktop, tabs + sheets on phone) inside a prototype stage */
:root{
  --surface:#E6E6E3;--sd:#C4C4C0;--sl:#FFFFFF;--line:#CFCFCB;--text:#111111;--muted:#4A4A4A;
  --red:#D0021B;--red-text:#B80218;--on-red:#FFFFFF;--scrim:rgba(17,17,17,.28);
  --lift:0 18px 48px rgba(17,17,17,.24),0 0 0 1px rgba(17,17,17,.06);
  --kb:#2F5BD3;--kb-soft:#D9E2F6;--fillhi:#F1E6B0;--bezel:#0E0E10;
  --font:'Archivo',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface:#1F2023;--sd:#141517;--sl:#2B2C30;--line:#34353A;--text:#F2F2F2;--muted:#A8A8A8;
  --red:#E5222F;--red-text:#FF5A63;--scrim:rgba(0,0,0,.5);--lift:0 18px 48px rgba(0,0,0,.6),0 0 0 1px #34353A;
  --kb:#8FAEFF;--kb-soft:#26304A;--fillhi:#4A4224;color-scheme:dark}}
:root[data-theme="dark"]{
  --surface:#1F2023;--sd:#141517;--sl:#2B2C30;--line:#34353A;--text:#F2F2F2;--muted:#A8A8A8;
  --red:#E5222F;--red-text:#FF5A63;--scrim:rgba(0,0,0,.5);--lift:0 18px 48px rgba(0,0,0,.6),0 0 0 1px #34353A;
  --kb:#8FAEFF;--kb-soft:#26304A;--fillhi:#4A4224;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--surface);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 32px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
svg.lucide{width:17px;height:17px;stroke-width:1.8;flex-shrink:0}
a{color:inherit}

/* depth */
.raised-xs{box-shadow:2px 2px 4px var(--sd),-2px -2px 4px var(--sl)}
.raised-sm{box-shadow:3px 3px 6px var(--sd),-3px -3px 6px var(--sl)}
.raised{box-shadow:4px 4px 8px var(--sd),-4px -4px 8px var(--sl)}
.raised-md{box-shadow:6px 6px 12px var(--sd),-6px -6px 12px var(--sl)}
.raised-lg{box-shadow:8px 8px 16px var(--sd),-8px -8px 16px var(--sl)}
.raised-xl{box-shadow:11px 11px 22px var(--sd),-11px -11px 22px var(--sl)}
.pressed-xs{box-shadow:inset 2px 2px 4px var(--sd),inset -2px -2px 4px var(--sl)}
.pressed{box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl)}
.pressed-lg{box-shadow:inset 5px 5px 10px var(--sd),inset -5px -5px 10px var(--sl)}

/* type */
.h1{font-size:44px;line-height:1;font-weight:900;letter-spacing:-.04em;margin:0}
.h2{font-size:22px;font-weight:900;letter-spacing:-.02em;margin:0;text-wrap:balance}
.cap{font-size:12.5px;color:var(--muted)}
.label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.label-swiss{display:flex;gap:8px;align-items:baseline;border-top:2px solid var(--text);padding-top:7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.label-swiss b{color:var(--red-text)}
.mono{font-family:var(--mono);font-size:14px;letter-spacing:.01em}
.mono .d{color:var(--red-text)}
.mono .s{color:var(--muted)}
.muted{color:var(--muted)}
.red{color:var(--red-text)}
.num{font-variant-numeric:tabular-nums}

/* controls */
.btn{height:44px;padding:0 18px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;white-space:nowrap;transition:box-shadow .12s ease-out;box-shadow:4px 4px 8px var(--sd),-4px -4px 8px var(--sl)}
.btn:active:not(:disabled){box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl)}
.btn-primary{background:var(--red);color:var(--on-red)}
.btn-primary svg.lucide{stroke-width:2.2}
.btn-danger{color:var(--red-text)}
.btn-danger-solid{background:var(--red);color:var(--on-red)}
.btn-ghost{box-shadow:none}
.btn-full{width:100%}
.icon-btn{width:44px;height:44px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;box-shadow:4px 4px 8px var(--sd),-4px -4px 8px var(--sl);transition:box-shadow .12s}
.icon-btn svg.lucide{width:19px;height:19px}
.icon-btn:active,.icon-btn.on{box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl);color:var(--red-text)}
.icon-btn.flat{box-shadow:none;width:40px;height:40px}
.icon-btn.flat:hover{box-shadow:3px 3px 6px var(--sd),-3px -3px 6px var(--sl)}
.input{height:46px;width:100%;padding:0 14px;border:0;border-radius:6px;background:var(--surface);box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl);font-size:14px}
textarea.input{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
select.input{appearance:none;cursor:pointer}
.input::placeholder{color:var(--muted)}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap>svg.lucide.lead{position:absolute;left:14px;color:var(--muted);pointer-events:none}
.input-wrap>.input.has-lead{padding-left:42px}
.input-wrap>.trail{position:absolute;right:4px;display:flex;gap:2px}
.input-wrap>.trail .icon-btn{width:38px;height:38px;box-shadow:none}
.input-wrap>.input.has-trail{padding-right:90px}
.fld{display:grid;gap:8px}
.fld>label{font-size:13px;font-weight:700}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:12px;color:var(--red-text);font-weight:600}
.chip{padding:9px 15px;border-radius:6px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:3px 3px 6px var(--sd),-3px -3px 6px var(--sl)}
.chip.on{box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl);color:var(--red-text);font-weight:800}
.chips{display:flex;gap:10px;padding:4px 4px 8px;overflow-x:auto;scrollbar-width:none}
.seg{display:inline-flex;padding:4px;border-radius:6px;gap:2px;box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{padding:7px 12px;border-radius:5px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--surface);color:var(--red-text);font-weight:800;box-shadow:3px 3px 6px var(--sd),-3px -3px 6px var(--sl)}
.seg button svg.lucide{width:15px;height:15px}
.toggle{width:54px;height:30px;border-radius:15px;position:relative;flex-shrink:0;box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl);transition:background .15s}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:2px 2px 4px var(--sd),-1px -1px 3px var(--sl);transition:left .15s}
.toggle.on{background:var(--red);box-shadow:inset 2px 2px 5px rgba(0,0,0,.28)}
.toggle.on::after{left:28px;box-shadow:1px 1px 3px rgba(0,0,0,.3)}
.check{width:24px;height:24px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 2px 2px 4px var(--sd),inset -2px -2px 4px var(--sl);flex-shrink:0}
.check.on{background:var(--red);color:var(--on-red);box-shadow:2px 2px 4px var(--sd),-2px -2px 4px var(--sl)}
.check svg.lucide{width:15px;height:15px;stroke-width:3}
.radio{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 2px 2px 4px var(--sd),inset -2px -2px 4px var(--sl);flex-shrink:0}
.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--red)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;white-space:nowrap}
.badge.out{border:1.5px solid var(--red-text);color:var(--red-text)}
.badge.solid{background:var(--red);color:var(--on-red)}
.badge.neutral{box-shadow:2px 2px 4px var(--sd),-2px -2px 4px var(--sl)}
.note{display:flex;gap:10px;align-items:flex-start;border-left:3px solid var(--red);padding:4px 0 4px 12px;font-size:13px}
.note svg.lucide{color:var(--red-text);margin-top:1px}
.panel{border-radius:6px;box-shadow:8px 8px 16px var(--sd),-8px -8px 16px var(--sl);background:var(--surface)}
.tile{width:44px;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:900;font-size:18px;letter-spacing:-.02em;box-shadow:3px 3px 6px var(--sd),-3px -3px 6px var(--sl)}
.tile svg.lucide{width:21px;height:21px}
.tile.lg{width:56px;height:56px;font-size:24px}
.spinner{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--red);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* prototype bar */
.proto{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding-block:16px 18px;max-width:1440px;margin:0 auto}
.proto-name{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.proto-name b{font-size:20px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.proto-name span{font-size:12px;color:var(--muted)}
.proto .grp{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.proto .grp .label{color:var(--muted)}
.try{max-width:1440px;margin:22px auto 0;display:grid;gap:10px}
.try ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px 22px}
.try li{font-size:13px;display:flex;gap:7px;align-items:baseline;max-width:100%}
.try li::before{content:"/";color:var(--red-text);font-weight:900}

/* stage */
.stage{max-width:1440px;margin:0 auto;display:flex;justify-content:center;gap:40px;align-items:flex-start;flex-wrap:wrap}
.app{position:relative;overflow:hidden;background:var(--surface)}
.app.desk{width:100%;height:clamp(660px,calc(100vh - 120px),900px);display:grid;grid-template-columns:256px minmax(0,1fr);gap:18px;padding:18px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line)}
.device{padding:11px;border-radius:46px;background:var(--bezel);flex-shrink:0}
.device .app{width:375px;height:780px;border-radius:36px}
.app.ph{display:flex;flex-direction:column}
.app.ph.bare{width:100%;height:calc(100vh - 140px);min-height:620px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line)}
.statusbar{height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:13px;font-weight:700}
.statusbar span:last-child{display:flex;gap:5px}
.statusbar svg.lucide{width:15px;height:15px}

/* sidebar */
.side{display:flex;flex-direction:column;gap:4px;padding:20px 14px;overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px;border-radius:6px;text-align:left;margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:6px;background:var(--red);color:var(--on-red);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:3px 3px 6px var(--sd),-3px -3px 6px var(--sl)}
.logo svg.lucide{width:21px;height:21px;stroke-width:2.2}
.brand b{display:block;font-size:18px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--muted)}
.picker{border-radius:6px;padding:6px;margin-bottom:14px;display:grid;gap:2px}
.picker button{height:40px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:6px;font-size:14px;font-weight:600;text-align:left}
.picker button:hover{box-shadow:inset 2px 2px 4px var(--sd),inset -2px -2px 4px var(--sl)}
.picker button .new{margin-left:auto}
.nav{display:grid;gap:3px}
.nav-link{height:42px;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:6px;font-size:14px;font-weight:600;color:var(--muted);width:100%;text-align:left;transition:box-shadow .12s,color .12s}
.nav-link svg.lucide{width:19px;height:19px}
.nav-link:hover:not(:disabled){color:var(--text)}
.nav-link.on{color:var(--red-text);font-weight:800;box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl)}
.nav-link .n{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.nav-link .n.alert{color:var(--red-text);font-weight:800}
.nav-sec{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 4px}
.nav-sec .label{color:var(--muted)}
.nav-sec button{color:var(--muted);display:flex}
.nav-sec button:hover{color:var(--red-text)}
.vcard{border-radius:6px;padding:14px;margin-top:auto;display:grid;gap:6px}
.vcard .big{font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1}
.stat{display:flex;align-items:center;gap:8px;height:30px;font-size:12px;width:100%;text-align:left;border-radius:6px;padding:0 4px}
.stat svg.lucide{width:14px;height:14px;color:var(--muted)}
.stat b{font-weight:600}
.stat .v{margin-left:auto;color:var(--muted);white-space:nowrap}
.stat.alert svg.lucide,.stat.alert .v{color:var(--red-text);font-weight:800}
button.stat:hover{box-shadow:3px 3px 6px var(--sd),-3px -3px 6px var(--sl)}
.rule{border-top:2px solid var(--line);margin:6px 0 2px}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;gap:18px}
.topbar{display:flex;gap:14px;align-items:center}
.topbar .input-wrap{flex:1}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;box-shadow:3px 3px 6px var(--sd),-3px -3px 6px var(--sl)}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.head .count{font-size:14px;color:var(--muted);font-weight:600}
.head .act{margin-left:auto;align-self:center}
.crumb{font-size:15px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center}
.crumb button:hover{color:var(--text)}
.crumb i,.crumb .sl{color:var(--red-text);font-weight:900}
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,400px);gap:18px}
.split>.panel{min-height:0;overflow-y:auto}
.listp{padding:8px}
.row{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:6px;width:100%;text-align:left;cursor:pointer;position:relative}
.row:hover .quick{opacity:1}
.row.sel{box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl)}
.row .info{min-width:0;flex:1}
.row .name{font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center;min-width:0}
.row .name span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .name svg.lucide{width:14px;height:14px;color:var(--red-text);fill:var(--red-text)}
.row .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.row .quick{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.row.sel .quick{opacity:1}
.row .code{font-family:var(--mono);font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center}
.grouphead{padding:14px 12px 6px}

/* detail */
.detail{padding:22px;display:flex;flex-direction:column;gap:18px}
.dhead{display:flex;gap:14px;align-items:center}
.dhead .t{min-width:0;flex:1}
.dhead .t b{display:block;font-size:20px;font-weight:900;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.fields{border-top:2px solid var(--text)}
.f{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:2px solid var(--line);min-height:62px}
.f .fv{min-width:0;flex:1}
.f .fl{font-size:12px;color:var(--muted);font-weight:600}
.f .val{font-size:15px;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
.f .val.mono{font-size:14.5px}
.f .val a{text-decoration:none}
.f .val a:hover{text-decoration:underline}
.f .acts{display:flex;gap:2px;flex-shrink:0}
.meter{display:flex;gap:4px;margin-top:6px;align-items:center}
.meter i{display:block;height:5px;flex:1;border-radius:3px;box-shadow:inset 1px 1px 2px var(--sd),inset -1px -1px 2px var(--sl)}
.meter i.f1{background:var(--red)}
.meter i.f2{background:var(--muted)}
.meter i.f3,.meter i.f4{background:var(--text)}
.meter span{font-size:12px;font-weight:700;margin-left:8px;white-space:nowrap;flex:0 0 auto}
.meter.wide{max-width:none}
.ring{--p:1;width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*360deg),var(--line) 0);position:relative;flex-shrink:0}
.ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.ring.sm{width:16px;height:16px}
.ring.sm::after{inset:3px}
.totp{font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:.06em}
.cardviz{border-radius:8px;padding:18px;aspect-ratio:1.586;max-width:320px;width:100%;display:flex;flex-direction:column;justify-content:space-between}
.cardviz .top{display:flex;justify-content:space-between;align-items:center;font-weight:900;letter-spacing:-.01em}
.cardviz .chipm{width:34px;height:26px;border-radius:5px;box-shadow:2px 2px 4px var(--sd),-2px -2px 4px var(--sl)}
.cardviz .numv{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:.08em}
.cardviz .bot{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.hist{display:grid;gap:4px;padding:6px 0}
.hist div{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.metaline{font-size:12px;color:var(--muted)}
.dactions{display:flex;gap:12px;flex-wrap:wrap;margin-top:auto}
.well{border-radius:6px;padding:44px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;margin:10px}
.well .tile{width:72px;height:72px;color:var(--muted)}
.well .tile svg.lucide{width:32px;height:32px}
.well p{margin:0;max-width:34ch}
.well .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* pages */
.page{flex:1;min-height:0;overflow-y:auto;padding:6px 6px 24px;display:flex;flex-direction:column;gap:20px}
.genout{border-radius:6px;padding:20px;display:flex;align-items:center;gap:12px}
.genout .mono{font-size:22px;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.35}
.genrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:2px solid var(--line);flex-wrap:wrap}
.genrow .grow{flex:1;min-width:0}
.genrow b{font-size:14px}
input[type=range]{appearance:none;-webkit-appearance:none;height:8px;border-radius:4px;flex:1;min-width:120px;background:var(--surface);box-shadow:inset 2px 2px 4px var(--sd),inset -2px -2px 4px var(--sl);accent-color:var(--red)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--red);box-shadow:2px 2px 4px var(--sd),-1px -1px 3px var(--sl);cursor:pointer}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:var(--red);cursor:pointer}
.opt{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;padding:6px 0;text-align:left}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 18px;width:100%}
.summary{border-radius:6px;padding:22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.summary .big{font-size:56px;font-weight:900;letter-spacing:-.05em;line-height:.9}

}
const ago = d => (d < 31 ? `${d} days ago` : d < 365 ? `${Math.round(d / 30)} months ago` : `${(d / 365).toFixed(1).replace('.0', '')} years ago`)

function visible() {
  let list = S.items.filter(i => (S.nav === 'trash' ? i.trashed : !i.trashed))
  if (S.report) list = list.filter(i => issues(i).some(x => x.k === S.report))
  else if (S.nav === 'fav') list = list.filter(i => i.fav)
  else if (TYPES[S.nav]) list = list.filter(i => i.type === S.nav)
  else if (S.nav.startsWith('folder:')) list = list.filter(i => i.folder === S.nav.slice(7))
  if (chipsShown() && S.chip !== 'all') list = list.filter(i => i.type === S.chip)
  if (S.q) {
    const q = S.q.toLowerCase()
    list = list.filter(i => [i.name, i.user, i.email, i.holder, ...(i.urls || [])].some(v => v && v.toLowerCase().includes(q)))
  }
  return list.sort((a, b) => a.name.localeCompare(b.name))
}
const chipsShown = () => !S.report && (S.nav === 'all' || S.nav === 'fav' || S.nav.startsWith('folder:'))
function reportCounts() {
  const c = {}
  for (const r of REPORT) c[r.k] = live().filter(i => issues(i).some(x => x.k === r.k)).length
  c.total = live().filter(i => issues(i).length).length
  return c
}

  return { generator: 'Generator', report: 'Security report', settings: 'Settings' }[S.nav]
}

// ---------- toasts ----------
let tid = 0
function toast(text, icon = 'check', opts = {}) {
  const t = { id: ++tid, text, icon, ...opts, born: Date.now() }
  if (t.clip) S.toasts = S.toasts.filter(x => !x.clip)
  S.toasts.push(t)
  S.toasts = S.toasts.slice(-3)
  drawToasts()
}
function toastText(t) {
  if (t.clip && !t.cleared) {
    if (S.settings.clip === 0) return `${t.text} copied`
    const rem = Math.max(0, S.settings.clip - Math.floor((Date.now() - t.born) / 1000))
    return `${t.text} copied · clears in <span class="num">${rem}s</span>`
  }
  return esc(t.text)
}
function drawToasts() {
  const box = document.querySelector('.app .toasts')
  if (!box) return
  box.innerHTML = S.toasts.map(t => `<div class="toast">${ic(t.cleared ? 'clipboard-x' : t.icon, t.icon === 'x' ? 'red' : '')}<span>${toastText(t)}</span></div>`).join('')
  icons()
}
let COPY = {}
async function copyText(v, label) {
  try { await navigator.clipboard.writeText(v) } catch { /* the frame may refuse; the toast still shows the flow */ }
  toast(label, 'clipboard-check', { clip: true })
}

// ---- master password: rules, form, recovery code ----
const TD_PW = 'TeleDrive@2026' // the demo's TeleDrive password, to show the "not your TeleDrive password" rule
const CROCK = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'
const newCode = () => Array.from({ length: 32 }, () => CROCK[rnd(32)]).join('').replace(/(.{4})(?!$)/g, '$1-')
function rules(pw, pw2) {
  return [
    ['len', 'At least 12 characters', pw.length >= 12],
    ['str', 'Rated Strong or Very strong', strength(pw).score >= 3],
    ['td', 'Not your TeleDrive password', !!pw && pw !== TD_PW],
    ['eq', 'Both entries match', !!pw && pw === pw2],
  ]
}
function rulesHTML(pw, pw2) {
  return rules(pw, pw2).map(([k, t, ok]) => `<li class="${ok ? '' : 'red'}" style="display:flex;gap:8px;align-items:center;font-size:13px;font-weight:${ok ? 600 : 700}">${ic(ok ? 'check' : 'x')}${t}</li>`).join('')
}
function masterFormHTML(p, { hint = false, label = 'Master password', next = 'Next', act } = {}) {
  return `<div class="fld"><label for="${p}-pw">${label}</label><div class="input-wrap">${ic('key-round', 'lead')}<input class="input has-lead" id="${p}-pw" data-master="${p}" type="password" autocomplete="new-password"></div>
      <div class="meter" id="${p}-meter">${meter('')}</div></div>
    <div class="fld"><label for="${p}-pw2">Type it again</label><input class="input" id="${p}-pw2" data-master="${p}" type="password" autocomplete="new-password"></div>
    <ul id="${p}-rules" style="list-style:none;margin:0;padding:0;display:grid;gap:4px">${rulesHTML('', '')}</ul>
    <button type="button" class="btn btn-ghost" style="justify-self:start;padding:0;height:30px" data-act="suggest" data-arg="${p}">${ic('dices')}Suggest a passphrase</button>
    ${hint ? `<div class="fld"><label for="${p}-hint">Hint <span class="cap" style="font-weight:500">(optional)</span></label><input class="input" id="${p}-hint" placeholder="Something only you would understand"><span class="hint">Encrypted, shown only on your devices. Don’t put the password in it.</span></div>` : ''}
    <div class="note">${ic('triangle-alert')}<span><b>Nobody can reset this password.</b> Not Telegram, not TeleDrive. Your recovery code is the only way back in.</span></div>
    <button type="button" class="btn btn-primary" id="${p}-next" data-act="${act}" disabled>${next}</button>`
}
function updateMaster(p) {
  const pw = document.getElementById(p + '-pw')?.value || '', pw2 = document.getElementById(p + '-pw2')?.value || ''
  const m = document.getElementById(p + '-meter'); if (m) m.innerHTML = meter(pw)
  const r = document.getElementById(p + '-rules'); if (r) { r.innerHTML = rulesHTML(pw, pw2); icons() }
  const b = document.getElementById(p + '-next'); if (b) b.disabled = !rules(pw, pw2).every(x => x[2])
}
function codeHTML(code, act, label) {
  return `<p style="margin:0">If you forget your master password, this code is the only way to open TeleWarden. It’s shown once.</p>
    <div class="pressed" style="border-radius:6px;padding:18px;text-align:center"><span class="mono" style="font-size:17px;font-weight:700;letter-spacing:.04em;overflow-wrap:anywhere">${code}</span></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button type="button" class="btn" data-act="copycode">${ic('copy')}Copy</button><button type="button" class="btn" data-act="savecode">${ic('file-down')}Save as file</button></div>

    <button type="button" class="opt" data-act="codesaved"><span class="check ${S.codeSaved ? 'on' : ''}">${S.codeSaved ? ic('check') : ''}</span>I’ve saved my recovery code</button>
    <button type="button" class="btn btn-primary" data-act="${act}" ${S.codeSaved ? '' : 'disabled'}>${label}</button>`
}

function overlays() {
  let h = ''
  if (S.drawer && isPhone()) h += `<div class="drawer" data-close="drawer">${sidebar()}</div>`
  if (S.sheet && isPhone() && S.sel && !S.dialog) {
    const i = S.items.find(x => x.id === S.sel)
    if (i) h += `<div class="scrim" data-close="sheet"><div class="dialog" style="padding:26px 6px 10px"><div class="handle"></div>${detailHTML(i)}</div></div>`
  }
  if (S.dialog) h += `<div class="scrim" data-close="dialog"><div class="dialog" role="dialog" aria-modal="true">${isPhone() ? '<div class="handle"></div>' : ''}${dialogHTML()}</div></div>`
  if (S.menu) h += `<div class="menu" style="left:${S.menu.x}px;top:${S.menu.y}px" role="menu">${S.menu.entries.map(e => (e.hr ? '<hr>' : `<button class="${e.danger ? 'danger' : ''}" data-act="${e.act}" data-arg="${esc(e.arg ?? '')}" role="menuitem">${ic(e.icon)}${esc(e.label)}</button>`)).join('')}</div>`
  return h
}
const dh = (icon, title, sub, lock) => `<div class="dh"><span class="tile raised-sm ${lock ? 'lock' : ''}">${ic(icon)}</span><div class="grow"><p class="h2">${esc(title)}</p>${sub ? `<span class="cap">${esc(sub)}</span>` : ''}</div><button class="icon-btn flat" data-act="closedialog" aria-label="Close">${ic('x')}</button></div>`

function dialogHTML() {
  const d = S.dialog
  if (d.kind === 'form') return formHTML()
  if (d.kind === 'confirm') return `${dh('trash-2', d.title, '', true)}<p style="margin:0">${esc(d.text)}</p>
    <div class="foot"><button class="btn btn-ghost" data-act="closedialog">Cancel</button><button class="btn btn-danger-solid" data-act="${d.act}" data-arg="${d.arg || ''}">${esc(d.label)}</button></div>`
  if (d.kind === 'folder') return `${dh('folder-plus', 'New folder')}<div class="fld"><label for="folderName">Name</label><input class="input" id="folderName" placeholder="e.g. Banking" autofocus>${d.err ? '<span class="err">Give the folder a name</span>' : ''}</div>
    <div class="foot"><button class="btn btn-ghost" data-act="closedialog">Cancel</button><button class="btn btn-primary" data-act="savefolder">Create</button></div>`
  if (d.kind === 'move') {
    const i = S.items.find(x => x.id === d.id)
    const opts = [{ id: '', name: 'No folder' }, ...S.folders]
    return `${dh('folder-input', 'Move to folder', i.name)}<div style="display:grid;gap:2px">${opts.map(f => `<button class="opt" data-act="movesel" data-arg="${f.id}"><span class="radio ${(i.folder || '') === f.id ? 'on' : ''}"></span>${esc(f.name)}</button>`).join('')}</div>
      <div class="foot"><button class="btn btn-ghost" data-act="closedialog">Done</button></div>`
  }
  if (d.kind === 'import') {
    const srcs = [['bitwarden', 'Bitwarden', '.json'], ['chrome', 'Chrome or Edge', '.csv'], ['firefox', 'Firefox', '.csv'], ['lastpass', 'LastPass', '.csv'], ['1password', '1Password', '.csv'], ['keepass', 'KeePass', '.xml']]
    const src = srcs.find(s => s[0] === d.src)
    if (d.step === 1) return `${dh('download', 'Import passwords', 'Step 1 of 2')}

      <div class="fld"><label for="expAcc">Master password</label><div class="input-wrap">${ic('key-round', 'lead')}<input class="input has-lead" id="expAcc" type="password"></div></div>
      <div class="foot"><button class="btn btn-ghost" data-act="closedialog">Cancel</button><button class="btn btn-primary" data-act="expgo">${ic('upload')}Export</button></div>`

  if (d.kind === 'recover') {
    if (d.step === 1) return `${dh('life-buoy', 'Use your recovery code', 'Forgot your master password')}
      <div class="fld"><label for="rc-code">Recovery code</label><input class="input mono" id="rc-code" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">

      ${S.setup.code ? `<p class="cap" style="margin:0">Demo: your code is <span class="mono">${S.setup.code}</span></p>` : '<p class="cap" style="margin:0">Demo: any 32 letters and digits work.</p>'}
      <button type="button" class="btn btn-ghost" style="justify-self:start;padding:0;height:30px" data-act="reset">Lost the code too? Reset TeleWarden</button>
      <div class="foot"><button class="btn btn-ghost" data-act="closedialog">Cancel</button><button class="btn btn-primary" data-act="recnext">Next</button></div>`
    if (d.step === 2) return `${dh('key-round', 'New master password', 'Step 2 of 3')}${masterFormHTML('rp', { act: 'recpw' })}`
    return `${dh('life-buoy', 'Your new recovery code', 'Step 3 of 3 · the old code no longer works')}${codeHTML(d.code, 'recdone', 'Open TeleWarden')}`
  }
  if (d.kind === 'chpw') return `${dh('key-round', 'Change master password')}
      <div class="fld"><label for="cp-cur">Current master password</label><input class="input" id="cp-cur" type="password">${d.err ? `<span class="err">${d.err}</span>` : ''}</div>
      ${masterFormHTML('cp', { label: 'New master password', next: 'Change master password', act: 'chpwsave' })}`
  if (d.kind === 'newcode') return d.step === 1
    ? `${dh('life-buoy', 'New recovery code', 'The old one stops working')}
      <div class="fld"><label for="nc-pw">Master password</label><div class="input-wrap">${ic('key-round', 'lead')}<input class="input has-lead" id="nc-pw" type="password"></div>${d.err ? `<span class="err">${d.err}</span>` : ''}</div>
      <div class="foot"><button class="btn btn-ghost" data-act="closedialog">Cancel</button><button class="btn btn-primary" data-act="newcodego">Make a new code</button></div>`
    : `${dh('life-buoy', 'Your new recovery code', 'The old one no longer works')}${codeHTML(d.code, 'newcodedone', 'Done')}`
  if (d.kind === 'reset') return `${dh('trash-2', 'Reset TeleWarden', '', true)}
      <div class="note">${ic('triangle-alert')}<span>Deletes every item in TeleWarden, on all your devices. This can’t be undone. Your files and photos aren’t touched.</span></div>
      <div class="fld"><label for="rs-td">TeleDrive password</label><div class="input-wrap">${ic('shield', 'lead')}<input class="input has-lead" id="rs-td" type="password"></div><span class="hint">Demo: ${TD_PW}</span></div>
      <div class="fld"><label for="rs-word">Type RESET to confirm</label><input class="input" id="rs-word" autocomplete="off">${d.err ? `<span class="err">${d.err}</span>` : ''}</div>
      <div class="foot"><button class="btn btn-ghost" data-act="closedialog">Cancel</button><button class="btn btn-danger-solid" data-act="resetgo">Reset TeleWarden</button></div>`
  if (d.kind === 'pin') return `${dh('grid-3x3', 'Set a PIN', 'Unlock with a PIN')}
      <div class="fld"><label for="pin1">PIN (4 to 8 digits)</label><input class="input mono" id="pin1" inputmode="numeric" maxlength="8" type="password"></div>
      <div class="note">${ic('info')}<span>After TeleDrive restarts, your master password is asked once before the PIN works again.</span></div>
      <div class="foot"><button class="btn btn-ghost" data-act="closedialog">Cancel</button><button class="btn btn-primary" data-act="pinsave">Set PIN</button></div>`
  if (d.kind === 'bio') return `<div class="bio"><p class="h2" style="margin:0">Unlock TeleWarden</p><span class="cap">Touch the fingerprint sensor</span>
      <button class="fp raised-md" data-act="biook" aria-label="Touch sensor">${d.ok ? ic('check') : ic('fingerprint')}</button>
      <button class="btn btn-ghost" data-act="closedialog">Use master password</button></div>`
  return ''
}

// ---------- autofill demo ----------
function autofillStage() {
  const a = S.af
  const vaultItem = S.items.find(i => i.id === 'i9')
  let screen
  if (a.step === 'signedin') {
    screen = `<div class="welcome"><span class="kb-logo" style="margin:0"><span class="m">${ic('bird')}</span>Kitebird</span><p class="h2">Welcome back, @${esc(a.user)}</p><p class="cap" style="margin:0">You’re signed in.</p>

  } else {
    const drop = a.step === 'dropdown'
      ? `<div class="afdrop">${a.locked
        ? `<button data-act="afunlock"><span class="tw">${ic('key-round')}</span><span><b>TeleWarden is locked</b><small>Tap to unlock and fill</small></span></button>`
        : `<button data-act="affill"><span class="tw">${ic('key-round')}</span><span><b>${esc(vaultItem.name)}</b><small>${esc(vaultItem.user)}</small></span></button>
           <button data-act="afother"><span class="tw" style="background:transparent;color:var(--muted)">${ic('search')}</span><span><b>Search TeleWarden</b><small>Pick another login</small></span></button>`}</div>` : ''
    screen = `<div class="kb">
      <div class="kb-logo"><span class="m">${ic('bird')}</span>Kitebird</div>
      <p class="h2" style="margin:0 0 4px">Log in</p>
      <div class="fieldwrap"><label for="kbUser">Username or email</label><input id="kbUser" class="${a.filled ? 'filled' : ''}" value="${esc(a.user)}" autocomplete="off">${drop}</div>
      <div class="fieldwrap"><label for="kbPass">Password</label><input id="kbPass" type="password" class="${a.filled ? 'filled' : ''}" value="${esc(a.pass)}" autocomplete="off"></div>
      <button class="go" data-act="aflogin">Log in</button>
      <p class="cap" style="text-align:center;margin:6px 0 0">Kitebird is a made-up app for this demo.</p>
    </div>`
  }
  let over = ''
  if (a.step === 'bio') over = `<div class="scrim"><div class="dialog"><div class="handle"></div><div class="bio">
      <span class="logo" style="width:36px;height:36px">${ic('key-round')}</span><p class="h2" style="margin:0">Unlock TeleWarden</p><span class="cap">To fill your login in Kitebird</span>
      <button class="fp raised-md" data-act="afbio" aria-label="Touch sensor">${a.bioOk ? ic('check') : ic('fingerprint')}</button>
      <button class="btn btn-ghost" data-act="afbio">Use master password</button></div></div></div>`
  if (a.step === 'save') {
    const upd = a.update
    over = `<div class="scrim"><div class="dialog"><div class="handle"></div>
      <div class="dh"><span class="logo">${ic('key-round')}</span><div class="grow"><p class="h2">${upd ? 'Update password in TeleWarden?' : 'Save to TeleWarden?'}</p><span class="cap">kitebird.example · Kitebird app</span></div></div>
      <div class="fields"><div class="f"><div class="fv"><div class="fl">Username</div><div class="val">${esc(a.user)}</div></div></div><div class="f"><div class="fv"><div class="fl">Password</div><div class="val mono">${'•'.repeat(Math.min(a.pass.length, 14))}</div><div class="meter">${meter(a.pass)}</div></div></div></div>
      <div class="foot"><button class="btn btn-ghost" data-act="afnosave">Not now</button><button class="btn btn-primary" data-act="afsave">${ic('check')}${upd ? 'Update' : 'Save'}</button></div></div></div>`
  }
  if (a.step === 'pick') over = `<div class="scrim"><div class="dialog"><div class="handle"></div>${dh('key-round', 'Choose a login', 'Search TeleWarden')}
      <div class="input-wrap">${ic('search', 'lead')}<input class="input has-lead" placeholder="Search" aria-label="Search"></div>
      <div>${live().filter(i => i.type === 'login').slice(0, 5).map(i => `<div class="row" data-act="afpick" data-arg="${i.id}">${tileHTML(i)}<div class="info"><div class="name"><span class="t">${esc(i.name)}</span></div><div class="sub">${esc(i.user)}</div></div></div>`).join('')}</div>
      <div class="note">${ic('info')}<span>Picking a login made for another site asks before filling.</span></div></div></div>`
  const order = ['idle', 'dropdown', 'bio', 'filled', 'signedin']

  const steps = [
    ['Tap the username field', 'Android asks TeleWarden for logins that match the Kitebird app.'],
    ['Tap “TeleWarden is locked”', 'Your vault stays locked until you choose to fill.'],
    ['Touch the fingerprint sensor', 'TeleWarden unlocks for this fill only.'],
    ['Tap the Kitebird login', 'Username and password are filled. Nothing is copied to the clipboard.'],

  }
  return `<div class="device"><div class="app ph">${statusBar()}${screen}${over}<div class="toasts"></div></div></div>
    <div class="steps"><div class="label-swiss"><b>/</b>Autofill on Android</div>

      <button class="btn" style="justify-self:start" data-act="afreset">${ic('rotate-ccw')}Restart demo</button></div>`
}

// ---------- actions ----------
function placeMenu(btn, entries) {
  const app = btn.closest('.app').getBoundingClientRect(), r = btn.getBoundingClientRect()
  const x = Math.max(8, Math.min(r.left - app.left, app.width - 252))
  let y = r.bottom - app.top + 6
  const h = entries.length * 42 + 20
  if (y + h > app.height - 8) y = Math.max(8, r.top - app.top - h - 6)
  S.menu = { x, y, entries }
}
const NEW_ENTRIES = [
  { label: 'Login', icon: 'globe', act: 'new', arg: 'login' }, { label: 'Card', icon: 'credit-card', act: 'new', arg: 'card' },
  { label: 'Identity', icon: 'contact', act: 'new', arg: 'identity' }, { label: 'Secure note', icon: 'sticky-note', act: 'new', arg: 'note' },
  { hr: true }, { label: 'Folder', icon: 'folder-plus', act: 'newfolder' }, { label: 'Import passwords', icon: 'download', act: 'import' },
]
function setScenario(k) {
  S.scenario = k; S.dialog = null; S.menu = null; S.sheet = false; S.drawer = false; S.picker = false; S.gateErr = false; S.q = ''; S.report = null
  if (k === 'first') { S.firstRun = true; S.unlocked = false; S.items = []; S.folders = []; S.nav = 'all'; S.sel = null; S.setup = { step: 1, code: '' }; S.master = null; S.hint = ''; S.codeSaved = false; S.tries = 0; S.waitUntil = 0; S.bioReady = false }
  else if (k === 'locked') { S.firstRun = false; S.unlocked = false; if (!S.items.length) { S.items = clone(ITEMS); S.folders = clone(FOLDERS) } }
  else if (k === 'vault') { S.firstRun = false; S.unlocked = true; if (!S.items.length) { S.items = clone(ITEMS); S.folders = clone(FOLDERS) } S.lastActive = Date.now(); if (!S.sel) S.sel = 'i1' }
  else S.af = newAF()
}
function unlock() {
  S.bioReady = true; S.tries = 0; S.waitUntil = 0; S.hintShown = false
  S.unlocked = true; S.firstRun = false; S.gateErr = false; S.lastActive = Date.now(); S.dialog = null; S.scenario = 'vault'
  if (!S.sel && S.items.length) S.sel = visible()[0]?.id
}
function lock(msg) {
  S.unlocked = false; S.reveal = {}; S.dialog = null; S.menu = null; S.sheet = false; S.drawer = false; S.histOpen = false; S.scenario = 'locked'
  if (msg) toast(msg, 'lock')
}
function selectFirst() { const v = visible(); if (!v.some(i => i.id === S.sel)) S.sel = isPhone() ? null : v[0]?.id || null }

const A = {
  scenario: k => setScenario(k),
  device: k => { S.device = k; S.sheet = false; S.drawer = false; S.menu = null },

    const el = document.documentElement, cur = el.getAttribute('data-theme')

    el.setAttribute('data-theme', next)
  },
  picker: () => { S.picker = !S.picker },
  drive: name => { toast(name === 'Log out' ? 'Log out works as it does today' : `${name} is part of TeleDrive already. This prototype shows TeleWarden.`, 'info') ; S.picker = false },
  drawer: () => { S.drawer = true },
  nav: id => { S.nav = id; S.report = null; S.chip = 'all'; S.q = ''; S.drawer = false; S.sheet = false; S.histOpen = false; selectFirst() },
  chip: k => { S.chip = k; selectFirst() },
  select: id => { S.sel = id; S.histOpen = false; if (isPhone()) S.sheet = true },
  reveal: k => { S.reveal[k] = !S.reveal[k] },

  hist: () => { S.histOpen = !S.histOpen },
  fav: id => { const i = S.items.find(x => x.id === id); i.fav = !i.fav; toast(i.fav ? `Added “${i.name}” to favorites` : `Removed “${i.name}” from favorites`, 'star') },
  more: (id, el) => {

    placeMenu(el, i.trashed
      ? [{ label: 'Restore', icon: 'rotate-ccw', act: 'restore', arg: id }, { hr: true }, { label: 'Delete forever', icon: 'trash-2', act: 'delforever', arg: id, danger: true }]
      : [{ label: 'Edit', icon: 'pencil', act: 'edit', arg: id }, { label: 'Clone', icon: 'copy-plus', act: 'clone', arg: id }, { label: 'Move to folder', icon: 'folder-input', act: 'move', arg: id },
        { label: i.fav ? 'Remove from favorites' : 'Add to favorites', icon: 'star', act: 'fav', arg: id }, { hr: true }, { label: 'Move to trash', icon: 'trash-2', act: 'trash', arg: id, danger: true }])
  },
  newmenu: (_, el) => { placeMenu(el, NEW_ENTRIES) },
  new: type => { S.menu = null; S.sheet = false; S.drawer = false; S.dialog = { kind: 'form', type, draft: draftFrom(type) } },
  edit: id => { const i = S.items.find(x => x.id === id); S.menu = null; S.sheet = false; S.dialog = { kind: 'form', type: i.type, id, draft: draftFrom(i.type, i) } },
  changepw: id => { A.edit(id); S.dialog.draft.pass = genPassword({ ...S.gen, len: 20, upper: true, lower: true, digits: true, symbols: true, avoid: false }); S.dialog.draft.showPass = true },
  clone: id => { const i = S.items.find(x => x.id === id); const c = { ...clone(i), id: 'x' + Date.now(), name: i.name + ' (copy)', fav: false, created: 'Today', edited: 'Today' }; S.items.push(c); S.sel = c.id; toast(`Cloned “${i.name}”`) },
  move: id => { S.dialog = { kind: 'move', id } },
  movesel: fid => { const i = S.items.find(x => x.id === S.dialog.id); i.folder = fid || null; toast(fid ? `Moved to ${folderName(fid)}` : 'Removed from its folder', 'folder') ; S.dialog = null },
  trash: id => { const i = S.items.find(x => x.id === id); i.trashed = true; i.tdays = 0; S.sheet = false; S.menu = null; selectFirst(); toast(`Moved “${i.name}” to the trash`, 'trash-2') },
  restore: id => { const i = S.items.find(x => x.id === id); delete i.trashed; delete i.tdays; S.dialog = null; S.sheet = false; selectFirst(); toast(`Restored “${i.name}”`, 'rotate-ccw') },
  delforever: id => { const i = S.items.find(x => x.id === id); S.dialog = { kind: 'confirm', title: 'Delete forever?', text: `“${i.name}” will be deleted from all your devices. This can’t be undone.`, label: 'Delete forever', act: 'dodelete', arg: id } },
  dodelete: id => { const i = S.items.find(x => x.id === id); S.items = S.items.filter(x => x.id !== id); S.dialog = null; S.sheet = false; selectFirst(); toast(`Deleted “${i.name}”`, 'trash-2') },
  emptytrash: () => { const n = S.items.filter(i => i.trashed).length; S.dialog = { kind: 'confirm', title: 'Empty trash?', text: `${plural(n, 'item')} will be deleted from all your devices. This can’t be undone.`, label: 'Empty trash', act: 'doempty' } },
  doempty: () => { S.items = S.items.filter(i => !i.trashed); S.dialog = null; S.sel = null; toast('Trash emptied', 'trash-2') },
  newfolder: () => { S.menu = null; S.drawer = false; S.dialog = { kind: 'folder' } },
  savefolder: () => {
    const v = document.getElementById('folderName').value.trim()
    if (!v) { S.dialog.err = true; return }
    const f = { id: 'f' + Date.now(), name: v }; S.folders.push(f); S.dialog = null; S.nav = 'folder:' + f.id; S.chip = 'all'; S.sel = null; toast(`Created folder “${v}”`, 'folder')
  },
  closedialog: () => { S.dialog = null },
  fshow: () => { S.dialog.draft.showPass = !S.dialog.draft.showPass },
  fgen: () => { S.dialog.draft.pass = genPassword({ ...S.gen, len: Math.max(S.gen.len, 16), mode: 'password' }); S.dialog.draft.showPass = true },
  furl: () => { S.dialog.draft.urls.push('') },
  fcf: t => { S.dialog.draft.fields.push({ k: '', v: '', t }) },
  scan: () => { toast('Opens the camera on Android, or reads a QR code from a screenshot', 'scan-qr-code'); return false },
  saveitem: () => {
    captureForm()
    const { type, id, draft: d } = S.dialog
    if (!d.name.trim()) { S.dialog.err = true; return }
    const base = { name: d.name.trim(), folder: d.folder || null, notes: d.notes, fields: d.fields.filter(f => f.k || f.v) }
    const typed = type === 'login' ? { user: d.user, pass: d.pass, totp: d.totp.trim(), urls: d.urls.map(u => u.trim()).filter(Boolean) }
      : type === 'card' ? { holder: d.holder, number: d.number.replace(/\s/g, ''), exp: d.exp, cvv: d.cvv }
      : type === 'identity' ? { first: d.first, last: d.last, email: d.email, phone: d.phone, address: d.address, passport: d.passport }
      : { note: d.note }
    if (id) {
      const i = S.items.find(x => x.id === id)
      if (type === 'login' && i.pass !== d.pass) { i.history = [{ p: i.pass, d: 'Today' }, ...(i.history || [])].slice(0, 5); i.changed = 0; delete i.breached }
      Object.assign(i, base, typed, { edited: 'Today' })
      toast(`Saved “${i.name}”`)
    } else {
      const i = { id: 'x' + Date.now(), type, ...base, ...typed, created: 'Today', edited: 'Today', changed: 0 }
      S.items.push(i); S.sel = i.id
      if (!visible().some(x => x.id === i.id)) { S.nav = 'all'; S.chip = 'all'; S.report = null; S.q = '' }
      toast(`Added “${i.name}”`)
    }
    S.dialog = null
    if (S.report) selectFirst()
  },
  lock: () => lock('TeleWarden locked'),
  setupnext: () => { S.setup.step = 2 },
  setupcode: () => {
    S.master = document.getElementById('mp-pw').value; S.hint = document.getElementById('mp-hint')?.value.trim() || ''
    S.setup.step = 3; S.setup.code = newCode(); S.codeSaved = false
  },
  setupdone: () => { S.firstRun = false; S.codeSaved = false; toast('TeleWarden is ready', 'key-round'); unlock() },
  suggest: pfx => {
    const v = genPassphrase({ ...S.gen, words: 5, sep: '-', cap: true, num: true })
    for (const id of [pfx + '-pw', pfx + '-pw2']) { const el = document.getElementById(id); if (el) { el.value = v; el.type = 'text' } }
    updateMaster(pfx); toast('Suggested a passphrase. Write it down somewhere safe.', 'dices'); return false
  },
  copycode: () => { copyText(S.dialog?.code || S.setup.code, 'Recovery code'); return false },
  savecode: () => { toast('Saves telewarden-recovery-code.txt (the app saves the file)', 'file-down'); return false },
  codesaved: () => { S.codeSaved = !S.codeSaved },
  showhint: () => { S.hintShown = !S.hintShown },
  recover: () => { S.dialog = { kind: 'recover', step: 1 } },
  recnext: () => {
    const v = (document.getElementById('rc-code').value || '').toUpperCase().replace(/[\s-]/g, '')
    const want = S.setup.code.replace(/-/g, '')
    if (want ? v !== want : !/^[0-9A-Z]{32}$/.test(v)) { S.dialog.err = 'That recovery code doesn’t match'; return }
    S.dialog = { kind: 'recover', step: 2 }
  },
  recpw: () => { S.master = document.getElementById('rp-pw').value; S.codeSaved = false; S.dialog = { kind: 'recover', step: 3, code: newCode() } },
  recdone: () => { S.setup.code = S.dialog.code; S.codeSaved = false; S.dialog = null; unlock(); toast('New master password and recovery code set', 'key-round') },
  chpw: () => { S.dialog = { kind: 'chpw' } },
  chpwsave: () => {
    const cur = document.getElementById('cp-cur').value
    if (S.master ? cur !== S.master : !cur) { S.dialog.err = 'Wrong master password'; return }
    S.master = document.getElementById('cp-pw').value; S.dialog = null; toast('Master password changed', 'key-round')
  },
  newcode: () => { S.dialog = { kind: 'newcode', step: 1 } },
  newcodego: () => {
    const v = document.getElementById('nc-pw').value
    if (S.master ? v !== S.master : !v) { S.dialog.err = 'Wrong master password'; return }
    S.codeSaved = false; S.dialog = { kind: 'newcode', step: 2, code: newCode() }
  },
  newcodedone: () => { S.setup.code = S.dialog.code; S.codeSaved = false; S.dialog = null; toast('New recovery code saved. The old one no longer works.', 'life-buoy') },
  reset: () => { S.dialog = { kind: 'reset' } },
  resetgo: () => {
    if (document.getElementById('rs-td').value !== TD_PW) { S.dialog.err = 'Wrong TeleDrive password'; return }
    if (document.getElementById('rs-word').value !== 'RESET') { S.dialog.err = 'Type RESET in capitals'; return }
    setScenario('first'); toast('TeleWarden was reset', 'trash-2')
  },
  bio: () => { S.dialog = { kind: 'bio' } },
  biook: () => { S.dialog.ok = true; render(); setTimeout(() => { unlock(); render() }, 450); return false },
  genmode: m => { S.gen.mode = m; regen() },
  regen: () => { regen() },
  genopt: k => { S.gen[k] = !S.gen[k]; regen() },
  gensep: s => { S.gen.sep = s === 'space' ? ' ' : s; regen() },
  report: k => { S.report = k; S.nav = 'all'; S.chip = 'all'; S.q = ''; S.sel = isPhone() ? null : visible()[0]?.id || null },
  breach: () => {
    S.checking = true
    setTimeout(() => { S.checking = false; const n = live().filter(i => i.breached).length; toast(`Checked ${live().filter(i => i.type === 'login').length} passwords · ${n} ${n === 1 ? 'was' : 'were'} found in breaches`, 'shield-check'); if (S.nav === 'report') render() }, 1400)
  },
  set: kv => { const [k, v] = kv.split('='); S.settings[k] = isNaN(+v) ? v : +v; S.lastActive = Date.now() },
  tog: k => { if (k === 'pin' && !S.settings.pin) { S.dialog = { kind: 'pin' }; return } S.settings[k] = !S.settings[k] },
  pinsave: () => { const v = document.getElementById('pin1').value; if (!/^\d{4,8}$/.test(v)) { toast('Use 4 to 8 digits', 'x'); return false } S.settings.pin = true; S.dialog = null; toast('PIN set') },
  autofillon: () => { S.settings.autofill = true; toast('Opens Android’s autofill settings. Pick TeleDrive there.', 'smartphone') },
  import: () => { S.menu = null; S.drawer = false; S.dialog = { kind: 'import', step: 1, src: 'bitwarden' } },
  impsrc: s => { S.dialog.src = s },
  impfile: () => { S.dialog.step = 2 },
  impgo: () => {
    const have = new Set(S.items.map(i => i.id))
    for (const i of clone(IMPORTED)) if (!have.has(i.id)) S.items.push(i)
    for (const f of FOLDERS) if (!S.folders.some(x => x.id === f.id)) S.folders.push({ ...f })
    S.dialog = null; S.nav = 'all'; S.chip = 'all'; S.sel = isPhone() ? null : 'i1'; toast(`Imported ${IMPORTED.length} items`, 'download')
  },
  export: () => { S.dialog = { kind: 'export', fmt: 'enc' } },
  expfmt: f => { S.dialog.fmt = f },
  expgo: () => { S.dialog = null; toast('Exported teledrive-vault-2026-10-07.json (the app saves the file)', 'upload') },

  // autofill demo
  afunlock: () => { S.af.step = 'bio'; S.af.next = 'fill' },
  afbio: () => {
    S.af.bioOk = true; render()
    setTimeout(() => {
      S.af.bioOk = false; S.af.locked = false
      if (S.af.next === 'save') { saveFromAF() } else S.af.step = 'dropdown'
      render()
    }, 450)
    return false
  },
  affill: () => { const i = S.items.find(x => x.id === 'i9'); Object.assign(S.af, { user: i.user, pass: i.pass, filled: true, step: 'filled' }); toast('Filled by TeleWarden', 'key-round') },
  afother: () => { S.af.step = 'pick' },
  afpick: id => { const i = S.items.find(x => x.id === id); Object.assign(S.af, { user: i.user, pass: i.pass, filled: true, step: 'filled' }); toast(`Filled “${i.name}”`, 'key-round') },
  aflogin: () => {
    const a = S.af
    a.user = document.getElementById('kbUser')?.value ?? a.user
    a.pass = document.getElementById('kbPass')?.value ?? a.pass
    if (!a.user || !a.pass) { toast('Enter a username and password', 'x'); return false }
    if (a.filled) { a.step = 'signedin'; return }
    const same = S.items.find(i => i.type === 'login' && !i.trashed && (i.urls || []).some(u => u.includes('kitebird')) && i.user === a.user)
    if (same && same.pass === a.pass) { a.step = 'signedin'; return }
    a.update = !!same; a.step = 'save'
  },
  afsave: () => { if (S.af.locked) { S.af.step = 'bio'; S.af.next = 'save'; return } saveFromAF() },
  afnosave: () => { S.af.step = 'signedin' },
  afreset: () => { S.af = newAF() },
}
function saveFromAF() {
  const a = S.af
  const same = S.items.find(i => i.type === 'login' && !i.trashed && (i.urls || []).some(u => u.includes('kitebird')) && i.user === a.user)
  if (same) { same.history = [{ p: same.pass, d: 'Today' }, ...(same.history || [])]; same.pass = a.pass; same.changed = 0; same.edited = 'Today'; toast('Password updated in TeleWarden', 'key-round') }
  else { S.items.push({ id: 'x' + Date.now(), type: 'login', name: 'Kitebird', folder: 'social', user: a.user, pass: a.pass, urls: ['https://kitebird.example', 'androidapp://com.kitebird.app'], created: 'Today', edited: 'Today', changed: 0 }); toast('Saved to TeleWarden', 'key-round') }
  a.step = 'signedin'
}

// ---------- events ----------
document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]')) return
  const hadMenu = !!S.menu
  if (S.menu && !e.target.closest('.menu')) S.menu = null
  const close = e.target.dataset?.close
  if (close) { if (close === 'dialog') S.dialog = null; if (close === 'sheet') S.sheet = false; if (close === 'drawer') S.drawer = false; render(); return }
  if (S.af.step === 'dropdown' && !e.target.closest('.afdrop') && !e.target.closest('#kbUser') && S.scenario === 'autofill') { S.af.step = S.af.filled ? 'filled' : 'idle'; if (!e.target.closest('[data-act]')) { render(); return } }
  const el = e.target.closest('[data-act]')
  if (!el) { if (hadMenu) render(); return }
  if (el.closest('.menu')) S.menu = null
  const fn = A[el.dataset.act]
  if (!fn) return
  if (fn(el.dataset.arg, el, e) !== false) render()
})
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.menu) S.menu = null; else if (S.dialog) S.dialog = null; else if (S.sheet) S.sheet = false; else if (S.drawer) S.drawer = false; else return; render() }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row[data-act]')) { e.preventDefault(); e.target.click() }
})
document.addEventListener('submit', e => {
  e.preventDefault()
  const f = e.target.dataset.form
  if (f === 'unlock') {
    if (S.waitUntil > Date.now()) return
    const pw = e.target.querySelector('input[type=password]').value
    if (!pw) S.gateErr = 'Enter your master password'
    else if (S.master ? pw !== S.master : pw === 'wrong') {
      S.tries++
      S.gateErr = `Wrong master password${S.tries < 5 ? ` · ${5 - S.tries} ${5 - S.tries === 1 ? 'try' : 'tries'} before a wait` : ''}`
      if (S.tries >= 5) S.waitUntil = Date.now() + 30000 * 2 ** (S.tries - 5)
    } else { unlock(); render(); return }
    render(); document.getElementById('gatePw')?.focus()
  }
})
document.addEventListener('input', e => {
  const t = e.target
  if (t.dataset.master) { updateMaster(t.dataset.master); return }
  if (t.id === 'search') {
    S.q = t.value
    const w = document.getElementById('listWrap'); const v = visible()
    if (w) { w.innerHTML = listHTML(v); icons() }
    const c = document.querySelector('.head .count'); if (c) c.textContent = plural(v.length, 'item')
  } else if (t.id === 'f-pass') {
    const m = document.getElementById('f-meter'); if (m) m.innerHTML = meter(t.value)
  } else if (t.id === 'f-number') {
    const b = document.getElementById('f-brand'); if (b) b.textContent = brandOf(t.value) || '—'
  } else if (t.id === 'genLen' || t.id === 'genWords') {
    if (t.id === 'genLen') S.gen.len = +t.value; else S.gen.words = +t.value
    document.getElementById(t.id + 'V').textContent = t.value
    S.gen.value = S.gen.mode === 'password' ? genPassword() : genPassphrase(); updateGen()
  } else if (t.id === 'kbUser') { S.af.user = t.value; S.af.filled = false; t.classList.remove('filled'); document.getElementById('kbPass')?.classList.remove('filled') }
  else if (t.id === 'kbPass') { S.af.pass = t.value; S.af.filled = false; t.classList.remove('filled') }
})
document.addEventListener('change', e => { if (e.target.id === 'genLen' || e.target.id === 'genWords') { regen(); render() } })
document.addEventListener('focusin', e => {
  if (e.target.id === 'kbUser' && S.scenario === 'autofill' && !S.af.filled && (S.af.step === 'idle')) {
    S.af.step = 'dropdown'; render(); const u = document.getElementById('kbUser'); u?.focus()
  }
})
for (const ev of ['pointerdown', 'keydown']) window.addEventListener(ev, () => { S.lastActive = Date.now() }, { capture: true, passive: true })
let wasNarrow = narrow()
window.addEventListener('resize', () => { if (narrow() !== wasNarrow) { wasNarrow = narrow(); render() } })

// ---------- clock: 2FA codes, auto-lock, clipboard ----------
function tick() {
  const s = step(), l = left()
  document.querySelectorAll('[data-totp]').forEach(el => { el.textContent = totp(el.dataset.totp, s) })
  document.querySelectorAll('[data-left]').forEach(el => { el.style.setProperty('--p', l / 30) })
  document.querySelectorAll('[data-left-s]').forEach(el => { el.textContent = l + 's' })
  if (S.unlocked && S.scenario === 'vault' && S.settings.lockAfter !== 'close' && Date.now() - S.lastActive > S.settings.lockAfter * 60000) {
    lock(`Locked after ${plural(S.settings.lockAfter, 'minute')} without activity`); render(); return
  }
  if (S.waitUntil && !S.unlocked) {
    const w = Math.ceil((S.waitUntil - Date.now()) / 1000), el = document.getElementById('gateWait')
    if (w <= 0) { S.waitUntil = 0; S.gateErr = false; render(); return }
    if (el) el.textContent = `Too many wrong tries. Try again in ${w} s`
  }
  const ll = document.getElementById('lockLeft'); if (ll) ll.textContent = lockLeftText()
  const lb = document.getElementById('lockBadge'); if (lb) lb.textContent = lockLeftText().replace('locks in ', 'OPEN · ')
  let dirty = false
  const now = Date.now()
  for (const t of S.toasts) {
    if (t.clip && !t.cleared && S.settings.clip && now - t.born >= S.settings.clip * 1000) { t.cleared = true; t.text = 'Clipboard cleared'; t.born = now; dirty = true }
  }
  const before = S.toasts.length
  S.toasts = S.toasts.filter(t => (t.clip && !t.cleared ? !(S.settings.clip === 0 && now - t.born > 3000) : now - t.born < 3200))
  if (dirty || before !== S.toasts.length || S.toasts.some(t => t.clip && !t.cleared)) drawToasts()
}
setInterval(tick, 1000)

regen()
render()
})()
</script>
